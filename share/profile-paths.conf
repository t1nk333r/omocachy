# Paths captured by bin/omocachy-profile-export.sh, relative to $HOME.
#
# One path per line; missing paths are skipped silently, so this list is a
# superset covering the usual Omarchy 4 desktop layout. Comments start with
# '#'. Pass a different file with --paths FILE to capture something else.
#
# What deliberately is NOT here:
#   - credential stores (~/.ssh, ~/.gnupg, ~/.config/gh/hosts.yml, ...).
#     They are also hard-denied in bin/lib/profile.sh, so adding them here
#     does not get them into a bundle.
#   - anything a package manager can put back (~/.local/share/mise runtimes,
#     ~/.cache, ~/.npm). The bundle records what to reinstall instead.
#   - user data (Documents, Pictures, Videos, ~/Projects). Copy those
#     yourself; a desktop-profile bundle is not a backup tool.

# --- the Omarchy 4 desktop itself -----------------------------------------
# ~/.config/omarchy holds the Quickshell layer: shell.json (bar layout, plugin
# list, idle rules), the plugins/ tree, themes, extensions and hooks.
.config/omarchy
.config/hypr
.config/uwsm
.config/waybar
.config/swayosd
.config/walker
.config/xdg-desktop-portal

# --- shells, prompt, tooling ----------------------------------------------
.config/fish
.config/mise
.config/starship.toml
.config/atuin
.config/zoxide
.bashrc
